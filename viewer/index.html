<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Royal Family Tree</title>
<style>
  html,body{margin:0;height:100%;font-family:Georgia,'Times New Roman',serif;background:#f6f4ef;color:#2b2b2b}
  #bar{position:fixed;top:0;left:0;right:0;height:44px;background:#3b2f4a;color:#fff;
       display:flex;align-items:center;gap:12px;padding:0 14px;z-index:10;box-shadow:0 1px 6px rgba(0,0,0,.3)}
  #bar b{font-size:15px;letter-spacing:.3px}
  #bar input{font-size:13px;padding:5px 8px;border:0;border-radius:4px;width:220px}
  #bar button{font-size:12px;padding:5px 9px;border:0;border-radius:4px;background:#5c4a6e;color:#fff;cursor:pointer}
  #bar button:hover{background:#6c5a7e}
  #bar span{font-size:12px;opacity:.8}
  svg{width:100%;height:100%;display:block}
  .link{fill:none;stroke:#c9b8d6;stroke-width:1.2px}
  .node circle{stroke:#6c5a7e;stroke-width:1.4px;cursor:pointer}
  .node text{font-size:12px;paint-order:stroke;stroke:#f6f4ef;stroke-width:3px}
  .node .yr{font-size:10px;fill:#8a7d70}
  .node .sp{font-size:10px;fill:#9a5a5a;font-style:italic}
  .hit circle{stroke:#c0392b;stroke-width:3px}
  .hint{position:fixed;bottom:8px;left:12px;font-size:11px;color:#8a7d70}
</style>
</head>
<body>
<div id="bar">
  <b>Royal Family Tree</b>
  <input id="q" placeholder="search a name, press Enter">
  <button id="expand">Expand all</button>
  <button id="collapse">Collapse all</button>
  <span id="info"></span>
</div>
<svg><g id="view"></g></svg>
<div class="hint">click a node to expand/collapse &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; drag to pan &nbsp;·&nbsp; filled = has hidden children</div>

<script>
const dx = 44, dy = 320;          // vertical gap per node, horizontal gap per generation
const svg = d3.select("svg"), gView = d3.select("#view");
const tree = d3.tree().nodeSize([dx, dy]);
const diagonal = d3.linkHorizontal().x(d=>d.y).y(d=>d.x);

const root = d3.hierarchy(TREE_DATA, d=>d.c);
const allNodes = root.descendants();
root.x0 = 0; root.y0 = 0;
let i = 0;
allNodes.forEach(d=>{ d.id = ++i; d._children = d.children;
  if (d.depth >= 1) d.children = null;   // start collapsed beyond the root
});
document.getElementById("info").textContent = (allNodes.length) + " people · root: " + root.data.n;

const zoom = d3.zoom().scaleExtent([0.05, 3]).on("zoom", e=>gView.attr("transform", e.transform));
svg.call(zoom).call(zoom.transform, d3.zoomIdentity.translate(120, window.innerHeight/2).scale(0.8));

function toggle(d){ if(d.children){ d._children=d.children; d.children=null; }
                    else { d.children=d._children; d._children=null; } update(d); }

function update(source){
  tree(root);
  const nodes = root.descendants(), links = root.links();

  const node = gView.selectAll("g.node").data(nodes, d=>d.id);
  const nEnter = node.enter().append("g").attr("class","node")
      .attr("transform",`translate(${source.y0},${source.x0})`)
      .on("click",(e,d)=>toggle(d));
  nEnter.append("circle").attr("r",4)
      .attr("fill",d=>d._children?"#6c5a7e":"#fff");
  nEnter.append("text").attr("dy","-0.6em").attr("x",8).attr("text-anchor","start")
      .text(d=>d.data.n);
  nEnter.append("text").attr("class","yr").attr("dy","0.7em").attr("x",8).text(d=>d.data.y||"");
  nEnter.append("text").attr("class","sp").attr("dy","1.9em").attr("x",8)
      .text(d=>d.data.s?("m. "+d.data.s):"");

  const nUpd = nEnter.merge(node);
  nUpd.transition().duration(180).attr("transform",d=>`translate(${d.y},${d.x})`);
  nUpd.select("circle").attr("fill",d=>d._children?"#6c5a7e":"#fff");
  node.exit().transition().duration(180)
      .attr("transform",`translate(${source.y},${source.x})`).remove();

  const link = gView.selectAll("path.link").data(links, d=>d.target.id);
  const lEnter = link.enter().insert("path","g").attr("class","link")
      .attr("d",()=>{const o={x:source.x0,y:source.y0};return diagonal({source:o,target:o});});
  lEnter.merge(link).transition().duration(180).attr("d",diagonal);
  link.exit().transition().duration(180)
      .attr("d",()=>{const o={x:source.x,y:source.y};return diagonal({source:o,target:o});}).remove();

  nodes.forEach(d=>{ d.x0=d.x; d.y0=d.y; });
}
update(root);

d3.select("#expand").on("click", ()=>{
  allNodes.forEach(d=>{ if(d._children){ d.children=d._children; d._children=null; } });
  update(root);
});
d3.select("#collapse").on("click", ()=>{
  allNodes.forEach(d=>{ if(d.depth>=1 && d.children){ d._children=d.children; d.children=null; } });
  update(root);
});

// search: expand paths to matches, highlight, center on the first
d3.select("#q").on("keydown", function(e){
  if(e.key!=="Enter") return;
  const term = this.value.trim().toLowerCase();
  gView.selectAll("g.node").classed("hit",false);
  if(!term) return;
  const hits = allNodes.filter(d=>d.data.n.toLowerCase().includes(term));
  hits.forEach(d=>{ let p=d.parent; while(p){ if(p._children){p.children=p._children;p._children=null;} p=p.parent; }});
  update(root);
  gView.selectAll("g.node").classed("hit", d=>hits.includes(d));
  document.getElementById("info").textContent = hits.length+" match(es) for \""+term+"\"";
  if(hits.length){ const t=hits[0];
    svg.transition().duration(500).call(zoom.transform,
      d3.zoomIdentity.translate(window.innerWidth/2 - t.y*0.8, window.innerHeight/2 - t.x*0.8).scale(0.8)); }
});
</script>
